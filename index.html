<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 28px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 22px 20px;
            margin: 18px 0;
            background: #1f6feb;
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
        }

        .button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Finance</h1>

        <a href="savings.html" class="button">Savings</a>

        <a href="loan.html" class="button">Loans</a>
    </div>

</body>
</html>
