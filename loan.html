<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Interest Calculator · Daily Breakdown</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f2f5f9;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background: white;
            max-width: 920px;
            width: 100%;
            border-radius: 28px;
            box-shadow: 0 25px 40px -12px rgba(0, 20, 30, 0.25);
            padding: 2rem 2rem 2.5rem;
            transition: all 0.2s;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            margin: 0 0 0.25rem 0;
            color: #0a2540;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .subhead {
            color: #4b677b;
            font-size: 0.95rem;
            margin-top: 0.2rem;
            margin-bottom: 1.8rem;
            border-left: 4px solid #2c7a7b;
            padding-left: 0.9rem;
            background: #f0f7f9;
            border-radius: 0 8px 8px 0;
            line-height: 1.4;
            font-weight: 400;
        }
        .input-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            margin-bottom: 1rem;
        }
        .input-group {
            flex: 1 1 200px;
        }
        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1e3f5c;
            margin-bottom: 0.4rem;
            letter-spacing: -0.01em;
        }
        .input-wrapper {
            display: flex;
            align-items: center;
            background: #f9fbfe;
            border: 1.5px solid #dae2ed;
            border-radius: 14px;
            padding: 0 0.2rem 0 1rem;
            transition: border 0.15s, box-shadow 0.15s;
        }
        .input-wrapper:focus-within {
            border-color: #2c7a7b;
            box-shadow: 0 0 0 3px rgba(44, 122, 123, 0.15);
            background: #ffffff;
        }
        .input-wrapper span {
            font-weight: 500;
            color: #2b4e6e;
            font-size: 1rem;
            padding-right: 0.2rem;
        }
        input {
            width: 100%;
            padding: 0.85rem 0.8rem 0.85rem 0.2rem;
            border: none;
            background: transparent;
            font-size: 1rem;
            font-weight: 500;
            color: #0a2540;
            outline: none;
            font-family: inherit;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .calc-btn {
            width: 100%;
            background: #0b2b3b;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin: 0.8rem 0 1.5rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.05s;
            box-shadow: 0 6px 14px rgba(11, 43, 59, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .calc-btn:hover {
            background: #1b4a5e;
        }
        .calc-btn:active {
            transform: scale(0.98);
        }
        .error-msg {
            color: #b13e3e;
            background: #ffebeb;
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
            font-size: 0.95rem;
            margin-bottom: 1rem;
            display: none;
            border-left: 5px solid #b13e3e;
            font-weight: 500;
        }
        .table-container {
            max-height: 500px;
            overflow-y: auto;
            border-radius: 18px;
            border: 1px solid #d9e2ec;
            background: white;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.8);
            margin-top: 0.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        th {
            background: #e9f0f5;
            color: #0a2e3b;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            padding: 0.9rem 1rem;
            text-align: right;
            position: sticky;
            top: 0;
            background: #e9f0f5;
            border-bottom: 1.5px solid #cbd8e4;
        }
        th:first-child {
            text-align: left;
        }
        td {
            padding: 0.75rem 1rem;
            text-align: right;
            border-bottom: 1px solid #e3eaf1;
            color: #1d3d52;
            font-weight: 450;
        }
        td:first-child {
            text-align: left;
            font-weight: 500;
            color: #0f384b;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background: #f6faff;
        }
        .highlight-day {
            background: #f0f9fa;
        }
        .interest-value {
            color: #b13e3e;
            font-weight: 500;
        }
        .new-balance {
            font-weight: 600;
            color: #0a2e3b;
        }
        .footer-note {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #6f8aa2;
            text-align: right;
            border-top: 1px dashed #cbdae6;
            padding-top: 0.9rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .badge {
            background: #e2f0f1;
            color: #1f6c6c;
            border-radius: 50px;
            padding: 0.25rem 0.85rem;
            font-weight: 500;
            font-size: 0.8rem;
        }
        .no-data-message {
            text-align: center;
            padding: 2.5rem 1rem;
            color: #5e7e96;
            font-size: 0.95rem;
            background: #fbfdff;
            border-radius: 18px;
        }
        .currency-symbol {
            font-weight: 500;
        }
        .small-note {
            font-size: 0.8rem;
            color: #4f6e85;
            margin-top: 0.3rem;
            padding-left: 0.2rem;
        }
        /* scrollbar styling */
        .table-container::-webkit-scrollbar {
            width: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #eef3f8;
            border-radius: 12px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #b9cfdf;
            border-radius: 12px;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>📋 Loan interest breakdown</h1>
    <div class="subhead">Daily interest &amp; new repayment value over 31 days. Interest calculated on a 365‑day year.</div>

    <!-- Input fields -->
    <div class="input-grid">
        <div class="input-group">
            <label for="loanAmount">Loan amount</label>
            <div class="input-wrapper">
                <span>£</span>
                <input type="number" id="loanAmount" placeholder="10000" min="0" step="any" value="10000">
            </div>
        </div>
        <div class="input-group">
            <label for="interestRate">Annual interest rate</label>
            <div class="input-wrapper">
                <input type="number" id="interestRate" placeholder="5.0" min="0" step="any" value="5.0">
                <span>%</span>
            </div>
        </div>
    </div>

    <!-- Calculate button -->
    <button class="calc-btn" id="calcBtn">
        <span>Show daily breakdown</span>
        <span style="font-size: 1.2rem;">📅</span>
    </button>

    <!-- Error message -->
    <div class="error-msg" id="errorMsg"></div>

    <!-- Table container -->
    <div class="table-container" id="tableContainer">
        <!-- Table injected via JS -->
    </div>

    <!-- Footer note -->
    <div class="footer-note">
        <span class="badge">31‑day schedule</span>
        <span>Simple daily interest · balance increases daily</span>
    </div>
</div>

<script>
    (function() {
        const amountInput = document.getElementById('loanAmount');
        const rateInput = document.getElementById('interestRate');
        const calcBtn = document.getElementById('calcBtn');
        const errorMsgDiv = document.getElementById('errorMsg');
        const tableContainer = document.getElementById('tableContainer');

        // Helper: format currency
        function formatCurrency(value) {
            return '£' + value.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        // Helper: format number with 2 decimals (for interest)
        function formatNumber(value) {
            return value.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        // Generate table data for 31 days (day 1 to 31)
        function generateTable(principal, annualRatePercent) {
            const annualRate = annualRatePercent / 100;
            const dailyRate = annualRate / 365;   // daily periodic rate

            const rows = [];
            let currentBalance = principal;   // start with original principal

            // Day 1 to 31 inclusive
            for (let day = 1; day <= 31; day++) {
                // Interest for the day = currentBalance * dailyRate
                const interest = currentBalance * dailyRate;
                // New balance = currentBalance + interest
                const newBalance = currentBalance + interest;

                rows.push({
                    day: day,
                    openingBalance: currentBalance,
                    interest: interest,
                    newBalance: newBalance
                });

                // Set currentBalance for next day = newBalance
                currentBalance = newBalance;
            }

            return rows;
        }

        // Render table inside tableContainer
        function renderTable(rows, principal, annualRate) {
            if (!rows || rows.length === 0) {
                tableContainer.innerHTML = '<div class="no-data-message">No data to display. Please enter valid loan details.</div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Day</th>
                            <th>Opening balance</th>
                            <th>Interest charged</th>
                            <th>New balance</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            rows.forEach(row => {
                html += `
                    <tr>
                        <td>${row.day}</td>
                        <td>${formatCurrency(row.openingBalance)}</td>
                        <td class="interest-value">${formatCurrency(row.interest)}</td>
                        <td class="new-balance">${formatCurrency(row.newBalance)}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            tableContainer.innerHTML = html;
        }

        // Calculate and update table
        function calculateAndRender() {
            // Hide previous error
            errorMsgDiv.style.display = 'none';
            errorMsgDiv.textContent = '';

            // Read inputs
            const amount = parseFloat(amountInput.value);
            const rate = parseFloat(rateInput.value);

            // Validation
            const errors = [];
            if (isNaN(amount) || amount < 0) {
                errors.push('Please enter a valid positive loan amount.');
            }
            if (isNaN(rate) || rate < 0) {
                errors.push('Please enter a valid positive interest rate.');
            }

            if (errors.length > 0) {
                errorMsgDiv.textContent = errors.join(' ');
                errorMsgDiv.style.display = 'block';
                tableContainer.innerHTML = '<div class="no-data-message">⚠️ Please fix the errors above.</div>';
                return;
            }

            // If amount is 0, interest will be 0, table can still show
            // Generate data
            const tableRows = generateTable(amount, rate);

            // Render
            renderTable(tableRows, amount, rate);
        }

        // Event listeners
        calcBtn.addEventListener('click', calculateAndRender);

        // Also recalc on Enter key
        [amountInput, rateInput].forEach(input => {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    calculateAndRender();
                }
            });
        });

        // Initial render on page load
        window.addEventListener('load', function() {
            // Set default values if empty
            if (!amountInput.value) amountInput.value = 10000;
            if (!rateInput.value) rateInput.value = 5.0;
            calculateAndRender();
        });

        // Optionally recalc on blur? Not necessary, but we keep it simple.
    })();
</script>
</body>
</html>
